openapi: 3.0.0
info:
  title: Lumei API
  version: 1.0.0
  description: API server for Lumei.
tags:
  - name: health
  - name: auth
  - name: users
  - name: categories
  - name: sync
paths:
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Refresh the tokens
      description: |-
        Exchanges a refresh token for a new access token and refresh token, and
        extends the session (BR-ACC-03). A refresh token just replaced still
        works for a minute, so a lost response doesn't sign the user out.
        Reusing it later ends the session, because only a copy would be used
        that late.

        Errors: 400 `invalid_request`; 401 `unauthenticated` when the refresh
        token is unknown, expired, or reused. Sign in again then.
      parameters: []
      responses:
        '200':
          description: New tokens. The refresh token in the request no longer works.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: The request is malformed or names something unsupported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The session token or ID token is missing, invalid, or expired. Sign in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionRequest'
  /auth/sign-in:
    post:
      operationId: signIn
      summary: Sign in
      description: |-
        Signs in with an ID token from Apple or Google, and starts a session.
        The first sign-in creates the account. A sign-in whose verified email
        matches an existing account opens that account (BR-ACC-07); any other
        email gets a separate account (BR-ACC-08).

        Errors: 400 `invalid_request` or `unsupported_provider`; 401
        `invalid_id_token`; 403 `email_not_verified` when the provider doesn't
        report the email as verified.
      parameters: []
      responses:
        '201':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: The request is malformed or names something unsupported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The session token or ID token is missing, invalid, or expired. Sign in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The request is understood but refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
  /auth/sign-out:
    post:
      operationId: signOut
      summary: Sign out
      description: |-
        Signs out this device by ending its session (BR-ACC-04), so its refresh
        token stops working. Its access token is checked without the database,
        so it works until it expires, at most 15 minutes; the app discards it.
        Other devices stay signed in.
      parameters: []
      responses:
        '204':
          description: Signed out.
        '401':
          description: The session token or ID token is missing, invalid, or expired. Sign in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - auth
      security:
        - BearerAuth: []
  /category-sets:
    get:
      operationId: listCategorySets
      summary: List the default category sets
      description: |-
        Returns the default category sets from the seed data, so a region or a
        set can change without an app update (BR-CAT-07). Setup lists the regions
        and copies the chosen set into the user's categories (BR-CAT-01).
      parameters: []
      responses:
        '200':
          description: The default category sets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySetList'
        '401':
          description: The session token or ID token is missing, invalid, or expired. Sign in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - categories
      security:
        - BearerAuth: []
  /health:
    get:
      operationId: getHealth
      summary: Basic health check with HTTP server status
      description: |-
        Confirms the web server is up and serving requests. It does not check
        dependencies; see /health/full for that.
      parameters: []
      responses:
        '200':
          description: Service is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicHealthResponse'
      tags:
        - health
  /health/full:
    get:
      operationId: getHealthFull
      summary: Detailed health check with dependency status
      description: |-
        Confirms downstream dependencies (the database) are reachable.
        Only a failing critical check answers 503; any other failing check answers
        200 with `status: degraded`.
      parameters: []
      responses:
        '200':
          description: Detailed health status of every dependency.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: A critical dependency (the database) is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      tags:
        - health
  /me:
    get:
      operationId: getMe
      summary: Get the signed-in user
      description: Returns the signed-in user. The app calls it on start to check the stored session (BR-ACC-03).
      parameters: []
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: The session token or ID token is missing, invalid, or expired. Sign in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - users
      security:
        - BearerAuth: []
  /sync/pull:
    get:
      operationId: pullChanges
      summary: Pull changes from the user's other devices
      description: |-
        Returns up to 500 of the user's rows changed after the cursor, oldest
        change first. A device that has never pulled sends 0.

        Errors: 400 `invalid_request` when `since` is missing or negative.
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: integer
            format: int64
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullResponse'
        '400':
          description: The request is malformed or names something unsupported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The session token or ID token is missing, invalid, or expired. Sign in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - sync
      security:
        - BearerAuth: []
  /sync/push:
    post:
      operationId: pushChanges
      summary: Push the device's changes
      description: |-
        Stores the device's changes. Each row goes through the conflict rules
        (BR-OFF-05): a deletion wins over any edit; otherwise the later
        `updated_at` wins; on a tie, the stored version stays. Pushing the same
        rows again changes nothing, so a lost response can be retried
        (BR-OFF-03).

        Errors: 400 `invalid_request` when the body isn't a list of up to 200
        rows of the known tables.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushResponse'
        '400':
          description: The request is malformed or names something unsupported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The session token or ID token is missing, invalid, or expired. Sign in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequest'
      security:
        - BearerAuth: []
components:
  schemas:
    BasicHealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
      description: Minimal health payload returned by the basic health check.
    CategoryRow:
      type: object
      required:
        - table
        - id
        - updated_at
        - deleted_at
        - name
        - emoji
        - position
        - archived_at
      properties:
        table:
          type: string
          enum:
            - categories
        id:
          type: string
          description: A UUID made on the device.
          example: 01963f5e-7a10-7c3e-9a51-8a3b6c1d2e4f
        updated_at:
          type: integer
          format: int64
          description: When the user made the change, by the device's clock (BR-OFF-05).
          example: 1793865600000
        deleted_at:
          type: integer
          format: int64
          nullable: true
          description: When the user deleted the record, or null while it exists. The row stays as a tombstone.
        name:
          type: string
          example: Eat Out
        emoji:
          type: string
          example: 🍔
        position:
          type: integer
          format: int32
          description: Display order when recording an expense, from 0 (BR-CAT-02).
        archived_at:
          type: integer
          format: int64
          nullable: true
          description: When the user archived it (BR-CAT-03), or null while active.
      description: A category (BR-CAT-01 to BR-CAT-03).
    CategorySet:
      type: object
      required:
        - region
        - name
        - countries
        - categories
      properties:
        region:
          type: string
          description: |-
            The region, e.g. `jp`. `global` is the set for every region without its
            own, offered at setup as "Other" (BR-SET-06).
          example: jp
        name:
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
          description: The region's name in each language, as shown at setup.
        countries:
          type: array
          items:
            type: string
          description: |-
            ISO 3166-1 alpha-2 codes of the device regions that preselect this set
            at setup, e.g. every EU member state for `eu`. Empty for `global`.
          example:
            - JP
        categories:
          type: array
          items:
            $ref: '#/components/schemas/DefaultCategory'
          description: The categories, in display order.
      description: The default categories of one region (BR-CAT-07).
    CategorySetList:
      type: object
      required:
        - sets
      properties:
        sets:
          type: array
          items:
            $ref: '#/components/schemas/CategorySet'
      description: Every default category set, in the order setup lists the regions.
    DefaultCategory:
      type: object
      required:
        - key
        - emoji
        - name
      properties:
        key:
          type: string
          description: |-
            Identifies the category across languages and sets, e.g. `eat_out`. The app
            derives the new category's ID from it.
          example: eat_out
        emoji:
          type: string
          example: 🍔
        name:
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
          description: The name in each language. Setup uses the app's language (BR-CAT-06).
      description: A category a new account starts with (BR-CAT-01).
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: |-
            A stable, machine-readable code, e.g. `invalid_request`,
            `unsupported_provider`, `invalid_id_token`, `email_not_verified`, or
            `unauthenticated`.
          example: invalid_id_token
        message:
          type: string
          description: "A description for developers. Don't show it to users: it isn't translated."
      description: An error the client can act on.
    ExpenseRow:
      type: object
      required:
        - table
        - id
        - updated_at
        - deleted_at
        - amount
        - category_id
        - date
        - spent_at
        - is_big_purchase
        - description
        - latitude
        - longitude
      properties:
        table:
          type: string
          enum:
            - expenses
        id:
          type: string
          description: A UUID made on the device.
          example: 01963f5e-7a10-7c3e-9a51-8a3b6c1d2e4f
        updated_at:
          type: integer
          format: int64
          description: When the user made the change, by the device's clock (BR-OFF-05).
          example: 1793865600000
        deleted_at:
          type: integer
          format: int64
          nullable: true
          description: When the user deleted the record, or null while it exists. The row stays as a tombstone.
        amount:
          type: integer
          format: int64
          description: Greater than 0 (BR-EXP-08).
          example: 1200
        category_id:
          type: string
        date:
          type: string
          description: The calendar date in the device's time zone when it happened (BR-EXP-02).
          example: '2026-11-05'
        spent_at:
          type: integer
          format: int64
          description: When it happened.
        is_big_purchase:
          type: boolean
          description: Whether it is a big purchase (BR-EXP-05).
        description:
          type: string
          nullable: true
          description: The optional description (BR-EXP-03).
        latitude:
          type: number
          format: double
          nullable: true
          description: Where it was recorded (BR-EXP-04), or null without a location.
        longitude:
          type: number
          format: double
          nullable: true
      description: An expense (BR-EXP-01 to BR-EXP-05).
    FixedExpenseRow:
      type: object
      required:
        - table
        - id
        - updated_at
        - deleted_at
        - period_id
        - name
        - amount
        - note
        - position
      properties:
        table:
          type: string
          enum:
            - fixed_expenses
        id:
          type: string
          description: A UUID made on the device.
          example: 01963f5e-7a10-7c3e-9a51-8a3b6c1d2e4f
        updated_at:
          type: integer
          format: int64
          description: When the user made the change, by the device's clock (BR-OFF-05).
          example: 1793865600000
        deleted_at:
          type: integer
          format: int64
          nullable: true
          description: When the user deleted the record, or null while it exists. The row stays as a tombstone.
        period_id:
          type: string
        name:
          type: string
          example: Rent
        amount:
          type: integer
          format: int64
          example: 85000
        note:
          type: string
          nullable: true
        position:
          type: integer
          format: int32
          description: Display order in the period, from 0.
      description: A fixed expense item of a period (BR-INC-02).
    HealthCheckEntry:
      type: object
      required:
        - status
        - critical
        - response_time_ms
        - timestamp
      properties:
        status:
          type: string
          example: healthy
        critical:
          type: boolean
          description: Whether a failure of this check makes the whole service unhealthy (503).
        response_time_ms:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: {}
          description: |-
            Check-specific diagnostics, present only on a passing check that has any.
            The database reports `driver` and its connection-pool counters.
      description: Result of one dependency's health check.
    HealthResponse:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          example: healthy
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthCheckEntry'
          description: 'One entry per dependency, keyed by name: `database` (critical).'
      description: |-
        Detailed health payload with one entry per dependency.
        `status` is `unhealthy` (503) when a critical check fails, `degraded` (200) when
        only non-critical checks fail, and `healthy` otherwise.
    IncomeRow:
      type: object
      required:
        - table
        - id
        - updated_at
        - deleted_at
        - period_id
        - name
        - amount
        - position
      properties:
        table:
          type: string
          enum:
            - incomes
        id:
          type: string
          description: A UUID made on the device.
          example: 01963f5e-7a10-7c3e-9a51-8a3b6c1d2e4f
        updated_at:
          type: integer
          format: int64
          description: When the user made the change, by the device's clock (BR-OFF-05).
          example: 1793865600000
        deleted_at:
          type: integer
          format: int64
          nullable: true
          description: When the user deleted the record, or null while it exists. The row stays as a tombstone.
        period_id:
          type: string
        name:
          type: string
          example: Salary
        amount:
          type: integer
          format: int64
          example: 640808
        position:
          type: integer
          format: int32
          description: Display order in the period, from 0.
      description: An income item of a period (BR-INC-01).
    LocalizedText:
      type: object
      required:
        - en
        - ja
        - fr
      properties:
        en:
          type: string
          example: Eat Out
        ja:
          type: string
          example: 外食
        fr:
          type: string
          example: Restaurant
      description: A text in every language the app supports (BR-SET-01).
    PeriodRow:
      type: object
      required:
        - table
        - id
        - updated_at
        - deleted_at
        - start_date
        - end_date
      properties:
        table:
          type: string
          enum:
            - periods
        id:
          type: string
          description: A UUID made on the device.
          example: 01963f5e-7a10-7c3e-9a51-8a3b6c1d2e4f
        updated_at:
          type: integer
          format: int64
          description: When the user made the change, by the device's clock (BR-OFF-05).
          example: 1793865600000
        deleted_at:
          type: integer
          format: int64
          nullable: true
          description: When the user deleted the record, or null while it exists. The row stays as a tombstone.
        start_date:
          type: string
          example: '2026-10-25'
        end_date:
          type: string
          example: '2026-11-24'
      description: A saving period (BR-PER-01). Both dates are inclusive.
    PullResponse:
      type: object
      required:
        - rows
        - cursor
        - has_more
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SyncRow'
          description: The user's rows changed after `since`, oldest change first, deleted ones included.
        cursor:
          type: integer
          format: int64
          description: Send as `since` in the next pull.
          example: 42
        has_more:
          type: boolean
          description: 'True when more rows are waiting: pull again with the new cursor.'
    PushOutcome:
      type: string
      enum:
        - applied
        - superseded
        - rejected
      description: |-
        What happened to a pushed row:
        - `applied`: the API now has this change.
        - `superseded`: the API already has a newer change, or a deletion; the next pull brings it.
        - `rejected`: the row is invalid; `code` says why.
    PushRequest:
      type: object
      required:
        - rows
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SyncRow'
          maxItems: 200
          description: Up to 200 rows, oldest change first.
    PushResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PushResult'
          description: One result per pushed row, in the order they were sent.
    PushResult:
      type: object
      required:
        - table
        - id
        - outcome
      properties:
        table:
          type: string
          description: The table of the pushed row.
          example: expenses
        id:
          type: string
          description: The ID of the pushed row.
        outcome:
          $ref: '#/components/schemas/PushOutcome'
        code:
          type: string
          description: |-
            Why the row was rejected: `invalid_row` (a field is missing or out of
            range), `not_owned` (the ID belongs to another user's record),
            `future_change` (`updated_at` is more than 5 minutes ahead of the API's
            clock, BR-OFF-05), or `currency_change` (BR-SET-04).
    RefreshSessionRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: The refresh token from the last sign-in or refresh.
    SavingTargetRow:
      type: object
      required:
        - table
        - id
        - updated_at
        - deleted_at
        - period_id
        - amount
      properties:
        table:
          type: string
          enum:
            - saving_targets
        id:
          type: string
          description: A UUID made on the device.
          example: 01963f5e-7a10-7c3e-9a51-8a3b6c1d2e4f
        updated_at:
          type: integer
          format: int64
          description: When the user made the change, by the device's clock (BR-OFF-05).
          example: 1793865600000
        deleted_at:
          type: integer
          format: int64
          nullable: true
          description: When the user deleted the record, or null while it exists. The row stays as a tombstone.
        period_id:
          type: string
        amount:
          type: integer
          format: int64
          example: 100000
      description: The saving target of a period (BR-TGT-01).
    SessionResponse:
      type: object
      required:
        - access_token
        - access_token_expires_at
        - refresh_token
        - user
      properties:
        access_token:
          type: string
          description: |-
            A JWT that authenticates requests: send it as
            `Authorization: Bearer <access_token>`. It is valid for 15 minutes.
        access_token_expires_at:
          type: string
          format: date-time
          description: When the access token expires. Get new tokens from `POST /auth/refresh` before then.
        refresh_token:
          type: string
          description: |-
            Gets new tokens from `POST /auth/refresh`. Each refresh replaces it, so
            store the new one. The session ends 90 days after the last refresh
            (BR-ACC-03). Keep it in the device's secure storage.
        user:
          $ref: '#/components/schemas/User'
    SettingsRow:
      type: object
      required:
        - table
        - id
        - updated_at
        - deleted_at
        - region
        - currency
        - period_start_day
        - big_purchase_spread
        - setup_completed_at
      properties:
        table:
          type: string
          enum:
            - settings
        id:
          type: string
          description: A UUID made on the device.
          example: 01963f5e-7a10-7c3e-9a51-8a3b6c1d2e4f
        updated_at:
          type: integer
          format: int64
          description: When the user made the change, by the device's clock (BR-OFF-05).
          example: 1793865600000
        deleted_at:
          type: integer
          format: int64
          nullable: true
          description: When the user deleted the record, or null while it exists. The row stays as a tombstone.
        region:
          type: string
          description: The region of the default categories (BR-SET-06), e.g. `jp`.
          example: jp
        currency:
          type: string
          description: The account currency (BR-SET-03), an ISO 4217 code. It can't change (BR-SET-04).
          example: JPY
        period_start_day:
          type: integer
          format: int32
          description: The day of the month periods start on, 1–31 (BR-PER-01).
          example: 25
        big_purchase_spread:
          type: string
          enum:
            - daysLeft
            - wholePeriod
          description: How big purchases are spread (BR-SET-05).
        setup_completed_at:
          type: integer
          format: int64
          description: When setup finished (BR-ACC-06).
      description: "The account's settings: one row, whose ID is the user ID."
    SignInProvider:
      type: string
      enum:
        - apple
        - google
        - dev
      description: The service a user signs in with (BR-ACC-01). `dev` works only where the server enables it.
    SignInRequest:
      type: object
      required:
        - provider
        - id_token
      properties:
        provider:
          allOf:
            - $ref: '#/components/schemas/SignInProvider'
          example: google
        id_token:
          type: string
          description: |-
            The ID token Sign in with Apple or Google returned to the app. For `dev`,
            the email address to sign in as.
    SyncColumns:
      type: object
      required:
        - id
        - updated_at
        - deleted_at
      properties:
        id:
          type: string
          description: A UUID made on the device.
          example: 01963f5e-7a10-7c3e-9a51-8a3b6c1d2e4f
        updated_at:
          type: integer
          format: int64
          description: When the user made the change, by the device's clock (BR-OFF-05).
          example: 1793865600000
        deleted_at:
          type: integer
          format: int64
          nullable: true
          description: When the user deleted the record, or null while it exists. The row stays as a tombstone.
      description: The sync columns every record has.
    SyncRow:
      type: object
      oneOf:
        - $ref: '#/components/schemas/SettingsRow'
        - $ref: '#/components/schemas/CategoryRow'
        - $ref: '#/components/schemas/PeriodRow'
        - $ref: '#/components/schemas/IncomeRow'
        - $ref: '#/components/schemas/FixedExpenseRow'
        - $ref: '#/components/schemas/SavingTargetRow'
        - $ref: '#/components/schemas/ExpenseRow'
      discriminator:
        propertyName: table
        mapping:
          settings: '#/components/schemas/SettingsRow'
          categories: '#/components/schemas/CategoryRow'
          periods: '#/components/schemas/PeriodRow'
          incomes: '#/components/schemas/IncomeRow'
          fixed_expenses: '#/components/schemas/FixedExpenseRow'
          saving_targets: '#/components/schemas/SavingTargetRow'
          expenses: '#/components/schemas/ExpenseRow'
      description: One record, whole, of any synced table. `table` says which.
    User:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
          example: 0199a6c5-3f4e-7c2a-9b1d-5e8f2a4c6d10
        email:
          type: string
          description: The account's email address, in lower case (BR-ACC-07).
          example: user@example.com
      description: A Lumei account.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
servers:
  - url: '{baseUrl}'
    description: Lumei API server
    variables:
      baseUrl:
        default: http://localhost:8080
